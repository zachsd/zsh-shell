# Compact two-line prompt with a blue/purple palette and Nerd Font icons.
add_newline = true
command_timeout = 500
format = "$os$username$hostname$directory$git_branch$git_status$python$cmd_duration$line_break$character"

[os]
disabled = false
style = "bold #7aa2f7"
[os.symbols]
Macos = " "
Linux = " "
Windows = "󰍲 "

[username]
show_always = false
style_user = "bold #bb9af7"
format = "[$user]($style) "
[hostname]
ssh_only = true
style = "#bb9af7"
format = "[@$hostname]($style) "
[directory]
style = "bold #7aa2f7"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
[git_branch]
symbol = " "
style = "#bb9af7"
[git_status]
style = "#ff9e64"
format = '([$all_status$ahead_behind]($style) )'
conflicted = '=${count} '
untracked = '?${count} '
modified = '~${count} '
staged = '+${count} '
renamed = '»${count} '
deleted = '-${count} '
stashed = '\$${count} '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕⇡${ahead_count}⇣${behind_count} '

[python]
symbol = " "
style = "bold #e0af68"
format = "via [${symbol}${virtualenv}]($style) "
detect_extensions = []
detect_files = []
detect_folders = []

[cmd_duration]
min_time = 0
show_milliseconds = true
style = "#e0af68"
format = "in [$duration]($style) "
[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"
